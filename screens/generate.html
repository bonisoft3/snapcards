        <p class="generator-subtitle" data-text="{msg.create_subtitle}"></p>

                  <button type="button" id="locale-opt-es" class="quick-pick-option" popovertarget="locale-combo-menu" popovertargetaction="hide" data-text="{msg.lang_opt_es}"></button>

          <div class="form-section study-mode-section">
            <label class="study-mode-control">
              <input type="checkbox" id="study-mode-toggle" class="study-mode-chk" />
              <div class="study-mode-details">
                <span class="study-mode-title" data-text="{msg.study_mode_label}"></span>
                <span class="study-mode-caption" data-text="{msg.study_mode_tip}"></span>
              </div>
            </label>
          </div>

          <!-- Actions -->
          <div class="form-actions">
            <button type="button" class="btn btn-primary btn-generate" id="btn-create" commandfor="create_set" command="create" data-text="{msg.create_button}"></button>
          </div>
        </div>
      </div>

      <!-- Bottom-Left (Desktop 58%) / Block #2 (Mobile): Visual-Filter Printable Fold-Sheet Proof (1. Front -> 2. Back -> 3. List) -->
      <!-- The deck the draft generates; the session's card when the session is on it, else its first. -->
      <aside class="generator-preview-panel" data-live="generation_form" data-filter="id=eq.draft" data-empty-row='{"id":"draft","topic":"","details":"","category":"","locale":"","region":"","card_count":5,"status":"idle","set_id":"","run":""}' data-reads="deck_level,play_session,card_set,localized_card,generation_form,device,me,deck_translation" data-read-draft_cheap="generation_draft?id=eq.{device.key}:draft-cheap" data-read-draft_heavy="generation_draft?id=eq.{device.key}:draft-heavy" data-read-flashcard="flashcard?set_id=eq.{set_id}" data-read-card_translation="card_translation?set_id=eq.{set_id}">
        <div class="preview-card-container" id="preview-card-container" data-set-id="{set_id}">
          <!-- The session's card when the session is on this deck: generate.css shows that position, else the first. -->
          <span hidden class="preview-selection" data-live="play_session" data-filter="id=eq.session&amp;set_id=eq.{set_id}"><template data-item><span data-index="{card_index}" data-tier-emoji="{emoji}"></span></template></span>
          <span hidden data-live="card_set" data-filter="id=eq.{set_id}"><template data-item><span><span data-live="me" data-filter="id=eq.{owner}"><template data-item><span class="owned-preview"></span></template></span></span></template></span>
          <div class="preview-header">
            <span class="preview-kicker" data-text="{msg.preview_badge}"></span>
            <span class="preview-status" id="preview-status-pill" data-live="flashcard" data-filter="set_id=eq.{set_id}" data-order="id.asc" data-project='{"position":"index","size":"count"}'>
              <template data-item><span class="preview-card-position" data-text="{msg.preview_print_ready}"></span></template>
            </span>
          </div>

          <div class="preview-fold-sheet">
            <!-- 1. Front -> Fold Spine -> 2. Back -->
            <div class="dual-sides-showcase">
              <!-- 1. Side A: Front (Illustration Only on Ink-Saving White Cardstock) -->
              <div class="specimen-preview-card side-front-card">
                <div class="specimen-card-header">
                  <span class="specimen-id" data-text="{msg.preview_front_side}"></span>
                </div>

                <div class="specimen-card-photo-box" id="preview-front-box">
                  <div class="crop-mark crop-tl" aria-hidden="true"></div>
                  <div class="crop-mark crop-tr" aria-hidden="true"></div>
                  <div class="crop-mark crop-bl" aria-hidden="true"></div>
                  <div class="crop-mark crop-br" aria-hidden="true"></div>
                  <div class="card-illustration preview-card-illustration" data-live="flashcard" data-filter="set_id=eq.{set_id}" data-order="id.asc">
                    <template data-item>
                      <img class="card-illustration-img" src="{back}" alt="" />
                    </template>
                  </div>
                </div>
              </div>

              <!-- Perforated Fold Spine (Print Studio Fold Mode) -->
              <div class="preview-fold-spine" aria-hidden="true">
                <span class="fold-pill" data-text="{msg.fold_label}"></span>
              </div>

              <!-- 2. Side B: Back (Target Card Word Only — Zero Extra Text) -->
              <div class="specimen-preview-card side-back-card">
                <div class="specimen-card-header">
                  <span class="specimen-id" data-text="{msg.preview_back_side}"></span>
                </div>

                <div class="specimen-back-word-box">
                  <div class="crop-mark crop-tl" aria-hidden="true"></div>
                  <div class="crop-mark crop-tr" aria-hidden="true"></div>
                  <div class="crop-mark crop-bl" aria-hidden="true"></div>
                  <div class="crop-mark crop-br" aria-hidden="true"></div>
                  <h3 class="specimen-name" id="preview-specimen-name" data-live="localized_card" data-filter="set_id=eq.{set_id}" data-order="id.asc">
                    <template data-item><span class="preview-specimen-word" data-text="{front}"></span></template>
                  </h3>
                </div>
              </div>
            </div>

            <!-- Deck navigation follows the same order as the preview count. -->
            <div class="preview-deck-strip" id="preview-deck-strip" aria-label="{msg.deck_rail_label}" data-live="localized_card" data-filter="set_id=eq.{set_id}" data-reads="play_session,card_set" data-order="id.asc">
              <template data-item>
                <button type="button" class="preview-strip-chip" data-on-click="play_select" data-id="{id}" data-card="{id}" data-name="{front}" data-front="{front}">
                  <span class="preview-chip-emoji" data-text="{emoji}"></span>
                  <span class="preview-chip-word" data-text="{front}"></span>
                </button>
              </template>
            </div>
          </div>
        </div>
      </aside>

      <!-- Right Column Bottom (Desktop 38%) / Block #3 (Mobile): Compact Press Ledger (Coleções Geradas) -->
      <div class="generated-deck-banner" id="generated-deck-banner" role="status" aria-live="polite">
        <div class="gen-progress-header">
          <span class="generated-check" id="gen-banner-icon" aria-hidden="true">✦</span>
          <div class="generated-banner-info">
            <span class="generated-banner-title" id="gen-banner-title" data-text="{msg.deck_generated_title}"></span>
            <span class="gen-phase-sub gen-phase-sub-ready" id="gen-phase-sub" data-text="{msg.gen_phase_ready}"></span>
          </div>
          <!-- A data-on-click binds only inside a region. -->
          <span class="tray-library-slot" data-live="play_session" data-filter="id=eq.session" data-empty-row='{"id":"session","set_id":"69618be6-9206-f9c7-59eb-b5e4b072cf3d","card_index":0,"flipped":"no","mastered":0,"total":20,"status":"playing","finished":"","front":"capybara","back":"","hint":"","emoji":"🦫"}' data-cortex="generateRows" data-machine-ref="collectionSelection">
            <a data-route="cards" data-param-shelf="mine" id="link-library-mine" class="tray-library-link" data-text="{msg.view_all_library_mine}"></a>
          </span>
        </div>
        <div class="keep-decks-offer">
          <span class="keep-decks-copy" data-text="{msg.keep_decks_offer}"></span>
          <button type="button" id="btn-keep-decks" class="btn btn-outline btn-keep-decks" data-auth-action="passkey-register" data-text="{msg.keep_decks_action}"></button>
        </div>

        <div class="gen-job-skeleton" aria-hidden="true">
          <div class="ai-tier-pipeline" data-next="1"><span class="ai-tier-step"></span><span class="ai-tier-step"></span><span class="ai-tier-step"></span></div>
        </div>
        <div class="press-ledger-slot" data-live="play_session" data-filter="id=eq.session" data-empty-row='{"id":"session","set_id":"69618be6-9206-f9c7-59eb-b5e4b072cf3d","card_index":0,"flipped":"no","mastered":0,"total":20,"status":"playing","finished":"","front":"capybara","back":"","hint":"","emoji":"🦫"}' data-reads="deck_level,card_set,play_session,print_config,localized_card,generation_form,device,me,deck_translation" data-read-draft_cheap="generation_draft?id=eq.{device.key}:draft-cheap" data-read-draft_heavy="generation_draft?id=eq.{device.key}:draft-heavy" data-read-flashcard="flashcard?set_id=eq.{set_id}" data-read-card_translation="card_translation?set_id=eq.{set_id}">
          <template data-item>
            <div class="press-ledger-item" data-jobs="{mastered}" data-tier-emoji="{emoji}">
              <div id="generation-jobs-list" class="generation-jobs-list press-ledger-table" data-live="localized_deck" data-filter="cover_emoji=eq.🎨" data-order="number.desc" data-reads="deck_level,card_set,play_session,print_config,generation_form,device,me,deck_translation" data-read-draft_cheap="generation_draft?id=eq.{device.key}:draft-cheap" data-read-draft_heavy="generation_draft?id=eq.{device.key}:draft-heavy" aria-live="polite">
                <template data-item>
                  <div class="gen-job-card gen-job-row" data-set-id="{id}">
                    <span hidden data-live="me" data-filter="id=eq.{owner}"><template data-item><span class="owned-generation"></span></template></span>
                    <span hidden data-live="deck_level" data-filter="set_id=eq.{id}"><template data-item><span class="deck-level-state" data-level="{level}" data-state="{status}"></span></template></span>
                    <a data-route="deck" data-param-deck="{id}" class="gen-job-permalink" data-set-id="{id}">
                      <span class="gen-job-num" data-number="{number}" data-text="{number}"></span>
                      <span class="gen-job-topic">
                        <strong class="gen-job-name" data-text="{name}"></strong>
                        <span class="gen-job-count">(<span data-text="{count}">5</span> <span data-text="{msg.cards_count}"></span>)</span>
                      </span>
                      <span class="gen-job-badge gen-job-badge-ready" data-text="{msg.gen_phase_ready}"></span>
                      <span class="gen-job-badge gen-job-badge-ai" data-text="{msg.gen_phase_ai}"></span>
                      <span class="gen-job-badge gen-job-badge-incomplete" data-text="{msg.gen_phase_incomplete}"></span>
                      <span class="gen-job-open-arrow" aria-hidden="true">↗</span>
                    </a>
                    <button type="button" class="btn-delete-job" commandfor="create_set" command="delete" data-on-click="create_set" data-action="delete" data-set-id="{id}" aria-label="{msg.delete_deck}">🗑️</button>
                    <div class="gen-job-progress" data-live="generation_form" data-filter="id=eq.draft&amp;set_id=eq.{id}">
                      <template data-item>
                        <div class="ai-tier-pipeline" data-next="{next}" aria-hidden="true">
                          <span class="ai-tier-step" data-state="{words}"></span>
                          <span class="ai-tier-step" data-live="deck_level" data-filter="id=eq.{set_id}:2"><template data-item><span class="ai-tier-fill" data-state="{status}" style="--drawn: {drawn}; --failed: {failed}; --unknown: {unknown}; --total: {total}"></span></template></span>
                          <span class="ai-tier-step" data-live="deck_level" data-filter="id=eq.{set_id}:3"><template data-item><span class="ai-tier-fill" data-state="{status}" style="--drawn: {drawn}; --failed: {failed}; --unknown: {unknown}; --total: {total}"></span></template></span>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>
              </div>

              <div class="generated-banner-actions" data-live="generation_form" data-filter="id=eq.draft" data-empty-row='{"id":"draft","topic":"","details":"","category":"","locale":"","region":"","card_count":5,"status":"idle","set_id":"","words":"","next":0,"audience_key":"diff_kids","audience":"","run":""}' data-cortex="generateRows" data-machine-ref="preview">
                <a data-route="deck" data-param-deck="{set_id}" class="btn btn-primary btn-open-explore" id="btn-open-explore" data-text="{msg.play_action}"></a>
                <a data-route="print" class="btn btn-outline btn-open-print" data-text="{msg.print_action}"></a>
                <button type="button" id="btn-create-more" class="btn btn-outline btn-create-more" commandfor="create_set" command="reset" data-text="{msg.gen_create_more}"></button>
              </div>
            </div>
          </template>
        </div>
      </div>
    </div>
  </div>
  </div>
</section>
