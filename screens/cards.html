<section class="screen" data-screen="cards" data-retarget-params="shelf">
  <button type="button" class="btn-more" popovertarget="more-sheet-cards" aria-label="{msg.nav_more}"><span aria-hidden="true">⋯</span></button>
  <nav id="more-sheet-cards" class="more-sheet" popover aria-label="{msg.nav_more}">
    <a data-route="cards" data-param-shelf="mine" class="more-link"><span class="more-icon" aria-hidden="true">🗂️</span><span data-text="{msg.nav_my_cards}"></span></a>
    <a data-route="cards" data-param-shelf="gallery" class="more-link"><span class="more-icon" aria-hidden="true">🌐</span><span data-text="{msg.nav_gallery}"></span></a>
    <a data-route="about" class="more-link"><span class="more-icon" aria-hidden="true">📖</span><span data-text="{msg.nav_about}"></span></a>
  </nav>
  <!-- The device's key scopes every read of its draft slots: a server render has no device, so it reads none. -->
  <div class="device-scope" data-live="device" data-filter="id=eq.device" data-empty-row='{"id":"device","key":"","theme":"auto"}' data-theme="{theme}" data-cortex="cardsRows" data-machine-ref="theme">
  <!-- A finished translation names its deck in details, and only then are that deck's cards read. -->
  <div hidden data-live="generation_draft" data-filter="id=eq.{device.key}:draft-cheap&amp;status=eq.done" data-empty=""><template data-item><div>
    <div id="translation-settles" data-empty="" data-live="flashcard" data-filter="set_id=eq.{details}" data-reads="play_session,card_set,print_config,generation_form,device,me,deck_translation" data-read-draft_cheap="generation_draft?id=eq.{device.key}:draft-cheap" data-read-draft_heavy="generation_draft?id=eq.{device.key}:draft-heavy" data-read-flashcard="flashcard?set_id=eq.{details}" data-read-card_translation="card_translation?set_id=eq.{details}" data-on-mutation="create_set"><template data-item><span></span></template></div>
  </div></template></div>
  <div hidden data-live="card_set" data-reads="card_set,deck_translation,localized_deck" data-on-mutation="localize_content"><template data-item><span></span></template></div>
  <!-- What creating a deck reads is that deck, so a seat follows the form to it. -->
  <div hidden data-live="generation_form" data-filter="id=eq.draft" data-empty-row='{"id":"draft","set_id":""}'><template data-item><div>
    <div id="generated-drafts-sync" class="generated-drafts-sync" data-empty="" data-live="generation_draft" data-filter="set_id=eq.{set_id}" data-order="id.asc" data-reads="play_session,card_set,print_config,generation_form,device,me,deck_translation" data-read-draft_cheap="generation_draft?id=eq.{device.key}:draft-cheap" data-read-draft_heavy="generation_draft?id=eq.{device.key}:draft-heavy" data-read-flashcard="flashcard?set_id=eq.{set_id}" data-read-card_translation="card_translation?set_id=eq.{set_id}" data-on-mutation="create_set">
    <template data-item><span></span></template>
  </div>
    <div id="generated-flashcards-sync" class="generated-drafts-sync" data-empty="" data-live="flashcard" data-filter="set_id=eq.{set_id}" data-reads="play_session,card_set,print_config,generation_form,device,me,deck_translation" data-read-draft_cheap="generation_draft?id=eq.{device.key}:draft-cheap" data-read-draft_heavy="generation_draft?id=eq.{device.key}:draft-heavy" data-read-flashcard="flashcard?set_id=eq.{set_id}" data-read-card_translation="card_translation?set_id=eq.{set_id}" data-on-mutation="create_set">
    <template data-item><span></span></template>
  </div>
  </div></template></div>

  <div class="library-shell" data-live="play_session" data-filter="id=eq.session" data-empty-row='{"id":"session","set_id":"69618be6-9206-f9c7-59eb-b5e4b072cf3d","card_index":0,"flipped":"no","mastered":0,"total":20,"status":"playing","finished":"","front":"capybara","back":"","hint":"","library_query":"","emoji":"🦫"}' data-reads="play_session,card_set,localized_card,generation_form,device,me,deck_translation" data-read-draft_cheap="generation_draft?id=eq.{device.key}:draft-cheap" data-read-draft_heavy="generation_draft?id=eq.{device.key}:draft-heavy" data-cortex="cardsRows" data-machine-ref="library" data-status="{status}" data-author-filter="{param.shelf}">
  <!-- Top Menu Bar with Live Search & Quick Actions -->
  <header class="library-top-bar">
    <div class="top-bar-breadcrumb">
      <span class="crumb-brand" data-text="{msg.app_title}"></span>
      <span class="crumb-sep">/</span>
      <span class="crumb-title" data-text="{msg.top_breadcrumb}"></span>
    </div>

    <div class="top-bar-search">
      <span class="search-icon">🔍</span>
      <input type="search" class="search-input" id="library-search" value="{library_query}" data-value="{library_query}" placeholder="{msg.search_placeholder}" autocomplete="off" />
      <kbd class="search-kbd">⌘K</kbd>
    </div>

    <div class="top-bar-actions">
      <div class="lang-switch">
        <a data-route="cards" data-locale="pt" data-locale-current="page" id="lang-pt" data-on-click="play_select" class="lang-link" data-text="{msg.lang_pt}"></a>
        <a data-route="cards" data-locale="es" data-locale-current="page" id="lang-es" data-on-click="play_select" class="lang-link" data-text="{msg.lang_es}"></a>
        <a data-route="cards" data-locale="en" data-locale-current="page" id="lang-en" data-on-click="play_select" class="lang-link" data-text="{msg.lang_en}"></a>
        <a data-route="cards" data-locale="he" data-locale-current="page" id="lang-he" data-on-click="play_select" class="lang-link" data-text="{msg.lang_he}"></a>
        <a data-route="cards" data-locale="zh" data-locale-current="page" id="lang-zh" data-on-click="play_select" class="lang-link" data-text="{msg.lang_zh}"></a>
        <a data-route="cards" data-locale="hi" data-locale-current="page" id="lang-hi" data-on-click="play_select" class="lang-link" data-text="{msg.lang_hi}"></a>
      </div>
      <div class="theme-switch" role="group">
        <button type="button" id="theme-auto" class="theme-btn" data-theme-val="auto" data-text="{msg.theme_auto}">Auto</button>
        <button type="button" id="theme-light" class="theme-btn" data-theme-val="light" >☀️</button>
        <button type="button" id="theme-dark" class="theme-btn" data-theme-val="dark" >🌙</button>
      </div>
      <a data-route="generate" class="btn btn-outline btn-top-new" data-text="{msg.sidebar_new_deck}"></a>
      <a data-route="print" id="btn-top-print" class="btn btn-primary btn-top-print" data-on-click="print_select" data-text="{msg.print_action}"></a>
    </div>
  </header>

  <a class="featured-hero" id="btn-hero-play" data-route="deck" data-param-deck="69618be6-9206-f9c7-59eb-b5e4b072cf3d" data-on-click="play_select" data-id="69618be6-9206-f9c7-59eb-b5e4b072cf3d" aria-labelledby="featured-hero-title">
    <div class="hero-cover">
      <div class="hero-bg-list" data-live="flashcard" data-filter="id=eq.c82890b5-5e84-48d6-9b73-36d3ef45b610">
        <template data-item>
          <img class="hero-bg-photo" src="{back}" alt="" />
        </template>
      </div>
      <div class="hero-gradient"></div>
      <div class="hero-content">
        <div class="hero-header-line">
          <span class="hero-badge" data-text="{msg.featured_badge}">Destaque</span>
          <span class="hero-pill-category" data-text="{msg.category_animals}">Animais</span>
        </div>
        <h2 id="featured-hero-title" class="hero-title" data-text="{msg.featured_title}">Animais Brasileiros</h2>
        <p class="hero-subtitle" data-text="{msg.featured_subtitle}">Coleção cultural da fauna brasileira em pranchas prontas para impressão e exploração</p>
        <div class="hero-meta">
          <span class="hero-meta-item">🐾 5 <span data-text="{msg.cards_count}">cards</span></span>
          <span class="hero-meta-item">🇧🇷 <span data-text="{msg.featured_region}">Brasil · pt-BR</span></span>
          <span class="hero-meta-item" data-text="{msg.format_offline}"></span>
        </div>
      </div>
    </div>
  </a>

  <!-- Category Filter Strip with Functional Radio Pills -->
  <div class="filter-strip">
    <div class="filter-pills">
      <input type="radio" name="cat" id="cat-all" value="all" checked class="pill-radio" tabindex="-1" />
      <label for="cat-all" id="lbl-cat-all" class="filter-pill-label" data-author="all" data-text="{msg.filter_all}"></label>


      <input type="radio" name="cat" id="cat-animals" value="Animals" class="pill-radio" tabindex="-1" />
      <label for="cat-animals" id="lbl-cat-animals" class="filter-pill-label" data-author="all" data-text="{msg.filter_fauna}"></label>

      <input type="radio" name="cat" id="cat-fruits" value="Fruits" class="pill-radio" tabindex="-1" />
      <label for="cat-fruits" id="lbl-cat-fruits" class="filter-pill-label" data-author="all" data-text="{msg.filter_fruits}"></label>

      <input type="radio" name="cat" id="cat-words" value="Words" class="pill-radio" tabindex="-1" />
      <label for="cat-words" id="lbl-cat-words" class="filter-pill-label" data-author="all" data-text="{msg.filter_words}"></label>
    </div>

    <div class="filter-badges">
      <span class="curatorial-badge" data-text="{msg.badge_curated}"></span>
      <span class="curatorial-badge" data-text="{msg.badge_print_ready}"></span>
    </div>
  </div>

  <div class="section-heading">
    <h3 class="section-title" data-text="{msg.explore_title}">Acervo de Fichas Culturais</h3>
    <p class="section-subtitle" data-text="{msg.explore_subtitle}">Fichas e coleções prontas para exploração digital e impressão em papel cartão</p>
  </div>

  <div class="my-cards-cta-card">
    <div class="my-cards-cta-info">
      <span class="my-cards-cta-icon" aria-hidden="true">✨</span>
      <div>
        <strong class="my-cards-cta-title" data-text="{msg.create_title}"></strong>
        <p class="my-cards-cta-sub" data-text="{msg.create_subtitle}"></p>
      </div>
    </div>
    <a data-route="generate" class="btn btn-primary my-cards-cta-btn" data-text="{msg.sidebar_new_deck}"></a>
  </div>

  <div class="deck-grid" data-live="localized_deck" data-filter="name=ilike.*{library_query}*" data-reads="play_session,card_set,print_config,generation_form,device,me,deck_translation" data-read-draft_cheap="generation_draft?id=eq.{device.key}:draft-cheap" data-read-draft_heavy="generation_draft?id=eq.{device.key}:draft-heavy" data-order="id.asc">
    <template data-item>
      <article class="card-set-item" data-id="{id}" data-category="{category}" data-cover-emoji="{cover_emoji}" data-ugc-locale="{locale}">
        <span hidden data-live="me" data-filter="id=eq.{owner}"><template data-item><span class="owned-deck"></span></template></span>
        <div class="card-cover">
          <a data-route="deck" data-param-deck="{id}" class="cover-canvas" data-on-click="play_select" data-id="{id}" aria-label="{name}">
            <!-- The deck's row of counts carries its cover: one read per card with the counts below. -->
            <div class="cover-illustration-list" data-live="deck_stats" data-filter="deck_id=eq.{id}">
              <template data-item>
                <img class="cover-illustration-img" data-image-src="{cover}" sizes="(max-width: 720px) 100vw, 33vw" alt="" loading="lazy" />
              </template>
            </div>
            <div class="cover-circle">
              <span class="cover-icon" data-text="{cover_emoji}">📚</span>
            </div>
          </a>
          <span class="category-pill" data-text="{category}">Category</span>
          <!-- The reader's own favourite: the probe is non-empty exactly when it is set,
               and the two forms swap on it; the count is everyone's. -->
          <span class="fav-probe" data-live="favorite" data-filter="deck_id=eq.{id}&amp;deleted_at=is.null"><template data-item><i></i></template></span>
          <form class="fav-arm when-unset" data-form="favorite" data-entity="favorite" data-action="upsert">
            <input type="hidden" name="deck_id" data-value="{id}">
            <input type="hidden" name="deleted_at" data-value="null">
            <button type="submit" class="btn-fav" aria-label="{msg.favorite_toggle}"><span aria-hidden="true">🤍</span> <span class="fav-count" data-live="deck_stats" data-filter="deck_id=eq.{id}" data-empty-row='{"favorite_count":0}' data-text="{favorite_count}">0</span></button>
            <p class="store-error" role="alert" hidden data-text="{msg.favorite_failed}"></p>
          </form>
          <form class="fav-arm when-set" data-form="unfavorite" data-entity="favorite" data-action="upsert">
            <input type="hidden" name="deck_id" data-value="{id}">
            <input type="hidden" name="deleted_at" data-value="{now}">
            <button type="submit" class="btn-fav" aria-label="{msg.unfavorite_toggle}"><span aria-hidden="true">❤️</span> <span class="fav-count" data-live="deck_stats" data-filter="deck_id=eq.{id}" data-empty-row='{"favorite_count":0}' data-text="{favorite_count}">0</span></button>
            <p class="store-error" role="alert" hidden data-text="{msg.favorite_failed}"></p>
          </form>
        </div>

        <div class="card-body">
          <h2 class="card-set-title"><a data-route="deck" data-param-deck="{id}" data-on-click="play_select" data-id="{id}" data-text="{name}">Deck Title</a></h2>
          <div class="card-set-meta">
            <span class="meta-count"><b data-text="{count}">0</b> <span data-text="{msg.cards_count}">cards</span></span>
            <span class="meta-locale" data-text="{locale}" data-text-format="language">pt-BR</span>
            <span class="meta-region" data-text="{region}">Brasil</span>
          </div>
          <div class="card-set-actions">
            <a data-route="print" class="btn btn-primary btn-print" data-on-click="print_select" data-id="{id}" data-text="{msg.print_action}">Print</a>
            <a data-route="deck" data-param-deck="{id}" class="btn btn-secondary btn-play" data-on-click="play_select" data-id="{id}" data-text="{msg.play_action}">Explore</a>
            <button type="button" class="btn btn-outline btn-delete-deck" commandfor="create_set" command="delete" data-on-click="create_set" data-action="delete" data-set-id="{id}" aria-label="{msg.delete_deck}">🗑️</button>
          </div>
        </div>
      </article>
    </template>
  </div>
  </div>
  </div>
</section>
