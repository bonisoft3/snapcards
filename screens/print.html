  </div></template></div>
  <!-- Labels for the cards this screen can show. -->

  </div></template></div>

          <div class="header-breadcrumb">

            <span class="crumb-sep" aria-hidden="true">/</span>
            <span class="crumb-section" data-text="{msg.top_breadcrumb}"></span>

          <div class="header-utility-actions">
            <div class="lang-switch">
              <a data-route="print" data-locale="pt" data-locale-current="page" class="lang-link" data-text="{msg.lang_pt}"></a>
              <a data-route="print" data-locale="es" data-locale-current="page" class="lang-link" data-text="{msg.lang_es}"></a>

          </div>
        </div>

        <div class="print-header-main">
          <div class="title-area">
            <h1 class="print-main-title" data-text="{msg.print_title}"></h1>
            <p class="subtitle vendor-home" data-text="{msg.print_subtitle}"></p>
            <p class="subtitle vendor-prodigi" data-text="{msg.print_subtitle_prodigi}"></p>
            <p class="subtitle vendor-shop" data-text="{msg.print_subtitle_shop}"></p>
          </div>

          <div class="print-actions">
            <div class="price-line vendor-prodigi"><strong data-text="{msg.price_at_checkout}"></strong><span data-text="{msg.price_depends}"></span></div>
            <button type="button" id="btn-order-print" data-host-dom="print-checkout" class="btn btn-primary btn-print btn-order-print vendor-prodigi" data-text="{msg.checkout_order}"></button>

        </div>
      </header>

      <div class="deck-selector-card">
        <div class="selector-header">
          <div class="selector-title-box">
            <span class="section-micro-label" data-text="{msg.deck_picker_title}"></span>
            <span class="selector-subtitle" data-text="{msg.deck_picker_sub}"></span>
            <span class="active-press-pill">
                <!-- The deck this screen prints is print_config's, not the session's. -->
                <span data-live="print_config" data-filter="id=eq.config" data-reads="print_config">
                  <span data-live="localized_deck" data-filter="id=eq.{set_id}" data-reads="card_set">
                    <template data-item>
                      <strong class="active-deck-name" data-text="{name}"></strong>
                    </template>
                  </span>
                </span>
            </span>
          </div>
          <div class="deck-search-box">
            <span class="search-glyph" aria-hidden="true">🔍</span>
            <input type="search" id="deck-search-input" class="deck-search-input" value="{back}" data-value="{back}" placeholder="{msg.deck_search_placeholder}" autocomplete="off" />
            <span class="deck-picker-count" data-text="{msg.popular_pill}"></span>
          </div>
        </div>

        <div class="deck-picker-stage">
          <div class="deck-picker-carousel" data-live="localized_deck" data-filter="name=ilike.*{back}*" data-reads="card_set" data-order="id.asc">

              <button type="button" class="deck-picker-card" data-on-click="print_select" data-id="{id}">

                    <span class="meta-locale" data-text="{locale}" data-text-format="language"></span>
                  </span>
                </span>
              </button>
            </template>
          </div>
        </div>
      </div>
    </section>

          <button type="button" id="btn-print-size" class="btn btn-outline control-btn vendor-home">
            <span class="btn-val" data-text="{msg[card_size]}"></span>
            <span class="btn-spec" data-card-spec="{card_size}" data-label-standard="{msg.spec_standard}" data-label-mini="{msg.spec_mini}" data-label-jumbo="{msg.spec_jumbo}" data-label-poster="{msg.spec_poster}"></span>
          </button>
        </div>

        <!-- 4. Print Mode (Fold / Two-Sided Horizontal Flip / Two-Sided Vertical Flip) -->
        <div class="control-box ctl-mode">
          <span class="control-label" data-text="{msg.print_mode_label}"></span>
          <div class="btn btn-outline control-btn vendor-prodigi" role="group" aria-disabled="true">
            <span class="btn-val" data-text="{msg.postcard_sides}"></span>
            <span class="btn-spec" data-text="{msg.locked_set_by_prodigi}"></span>
          </div>
          <div class="btn btn-outline control-btn vendor-shop" role="group" aria-disabled="true">
            <span class="btn-val" data-text="{msg.shop_mode}"></span>
            <span class="btn-spec" data-text="{msg.shop_mode_reason}"></span>
          </div>
          <button type="button" id="btn-print-grid" class="btn btn-outline control-btn vendor-home">
            <span class="btn-val" data-text="{msg[layout]}"></span>
            <span class="btn-spec" data-grid-spec="{layout}" data-label-fold="{msg.spec_fold}" data-label-duplex-h="{msg.spec_duplex_h}" data-label-duplex-v="{msg.spec_duplex_v}" data-label-2x2="{msg.spec_2x2}" data-label-3x3="{msg.spec_3x3}"></span>
          </button>
        </div>

        <!-- 5. Cut Lines & Crop Marks -->
        <div class="control-box ctl-lines">
          <span class="control-label" data-text="{msg.cut_lines}"></span>
          <div class="btn btn-outline control-btn vendor-prodigi" role="group" aria-disabled="true">
            <span class="btn-val" data-text="{msg.no}"></span>
            <span class="btn-spec" data-text="{msg.locked_trimmed_by_prodigi}"></span>
          </div>
          <div class="btn btn-outline control-btn vendor-shop" role="group" aria-disabled="true">
            <span class="btn-val" data-text="{msg.no}"></span>
            <span class="btn-spec" data-text="{msg.shop_lines_reason}"></span>
          </div>
          <button type="button" id="btn-print-lines" class="btn btn-outline control-btn vendor-home">
            <span class="btn-val" data-text="{msg[cut_lines]}"></span>
            <span class="btn-spec" data-lines-spec="{cut_lines}" data-label-yes="{msg.spec_lines_yes}" data-label-no="{msg.spec_lines_no}"></span>
          </button>
        </div>

        <div class="control-box ctl-stock vendor-prodigi">
          <span class="control-label" data-text="{msg.stock_label}"></span>
          <button type="button" id="btn-print-stock" class="btn btn-outline control-btn">
            <span class="btn-val" data-text="{msg[stock]}"></span>
            <span class="btn-spec" data-stock-spec="{stock}" data-label-gloss="{msg.spec_gloss}" data-label-mohawk="{msg.spec_mohawk}"></span>
          </button>
        </div>
        <div class="shop-order vendor-shop">
          <span class="control-label" data-text="{msg.shop_order_label}"></span>
          <p id="shop-order-text" class="shop-order-text" data-text="{msg.shop_order_text}"></p>
          <p class="shop-order-hint" data-text="{msg.shop_order_hint}"></p>
          <div class="shop-order-actions">
            <button type="button" id="btn-shop-copy" data-host-dom="print-checkout" class="btn btn-outline" data-text="{msg.shop_copy}"></button>
            <span id="print-shop-status" class="shop-order-status" role="status" aria-live="polite"></span>
          </div>
        </div>
        <p class="product-note vendor-prodigi"><span><strong data-text="{msg.product_note_title}"></strong> <span data-text="{msg.product_note}"></span></span></p>
      </div>
    </section>

    <!-- Realistic Paper Sheet Preview (Fold Mode Pairs OR Two-Sided Front + Mirrored Back Sheets) -->
    <div class="print-preview-wrapper">
      <div class="preview-title-bar">
        <div class="preview-title-left">
          <span class="section-micro-label vendor-home" data-text="{msg.print_preview_title}"></span>
          <span class="preview-meta-pill sheet-geometry-summary vendor-home" data-text="{msg.print_preview_sub}"></span>
          <span class="section-micro-label vendor-cards" data-text="{msg.postcard_preview_title}"></span>
          <span class="preview-meta-pill vendor-prodigi" data-text="{msg.postcard_preview_sub}"></span>
          <span class="preview-meta-pill vendor-shop" data-text="{msg.shop_preview_sub}"></span>
        </div>
        <div class="preview-badge-group vendor-home">
          <span class="sheet-spec-badge" data-text="{msg[paper]}"></span>
          <span class="sheet-spec-badge" data-text="{msg[orientation]}"></span>
          <span class="sheet-spec-badge" data-text="{msg[card_size]}"></span>
          <span class="sheet-spec-badge" data-text="{msg[layout]}"></span>
        </div>
        <div class="preview-badge-group vendor-shop">
          <span class="sheet-spec-badge" data-text="{msg.shop_size}"></span>
          <span class="sheet-spec-badge" data-text="{msg[orientation]}"></span>
          <span class="sheet-spec-badge" data-text="{msg.shop_mode}"></span>
          <span class="sheet-spec-badge" data-text="{msg.shop_bleed}"></span>
        </div>
        <div class="preview-badge-group vendor-prodigi">
          <span class="sheet-spec-badge" data-text="{msg.postcard_size}"></span>
          <span class="sheet-spec-badge" data-text="{msg.locked_orientation}"></span>
          <span class="sheet-spec-badge" data-text="{msg.postcard_sides}"></span>
          <span class="sheet-spec-badge" data-stock-badge="{stock}" data-label-gloss="{msg.stock_gloss_spec}" data-label-mohawk="{msg.stock_mohawk_spec}"></span>
        </div>
      </div>

      <div class="postcard-preview vendor-cards">
        <div class="postcards" data-live="localized_card" data-filter="set_id=eq.{set_id}" data-order="id.asc">
          <template data-item>
            <div class="postcard-pair">
              <figure class="postcard-side">
                <div class="postcard-bleed"><div class="postcard-trim"><div class="postcard-art print-card-illustration" data-live="flashcard" data-filter="id=eq.{id}">
                  <template data-item><img class="card-illustration-img" src="{back}" alt="" /></template>
                </div></div></div>
                <figcaption data-side="{msg.postcard_front}"></figcaption>
              </figure>
              <figure class="postcard-side">
                <div class="postcard-bleed"><div class="postcard-trim"><div class="postcard-word" data-text="{front}"></div></div></div>
                <figcaption data-side="{msg.postcard_back}"></figcaption>
              </figure>
            </div>
          </template>
        </div>
        <div class="postcard-legend">
          <span>
            <span class="postcard-key"><i class="postcard-swatch trim"></i><span data-text="{msg.postcard_legend_trim}"></span></span>
            <span class="postcard-key"><i class="postcard-swatch bleed"></i><span data-text="{msg.postcard_legend_bleed}"></span></span>
          </span>
          <span class="postcard-shown" data-live="localized_deck" data-filter="id=eq.{set_id}" data-reads="card_set">
            <template data-item><span><span class="postcard-count"></span> <span data-text="{msg.postcard_shown_of}"></span> <b data-text="{count}"></b> <span data-text="{msg.postcard_shown_cards}"></span></span></template>
          </span>
        </div>
      </div>

      <div class="print-sheet-preview vendor-home" data-paper="{paper}" data-orientation="{orientation}" data-card-size="{card_size}" data-layout="{layout}" data-is-fold="{layout}" data-lines="{cut_lines}">
        <!-- Sheet 1: Fold Mode Sheet OR Two-Sided Front Sheet (Illustrations Only) -->
        <div class="sheet-paper sheet-paper-primary">
          <div class="sheet-masthead">
            <span class="sheet-archival-seal" data-text="{msg.print_sheet_header}"></span>
            <span class="sheet-archival-serial" data-text="{msg.sheet_serial_label}"></span>
          </div>

          <div class="sheet-grid" data-live="localized_card" data-filter="set_id=eq.{set_id}" data-order="id.asc">
            <template data-item>
              <div class="print-card-cell" data-cut-sheet="{msg.cut_sheet}" data-cut-page="{msg.cut_page}" data-cut-next="{msg.cut_next}">
                <div class="print-card" data-id="{id}" data-set-id="{set_id}" data-front="{front}" data-emoji="{emoji}">
                  <div class="cell-crop-tl" aria-hidden="true"></div>
                  <div class="cell-crop-tr" aria-hidden="true"></div>
                  <div class="cell-crop-bl" aria-hidden="true"></div>
                  <div class="cell-crop-br" aria-hidden="true"></div>

                  <!-- Front Half: Illustration Image Only -->
                  <div class="print-card-front-half">
                    <div class="print-card-illustration" data-live="flashcard" data-filter="id=eq.{id}">
                      <template data-item><img class="card-illustration-img" src="{back}" alt="" /></template>
                    </div>
                  </div>

                  <!-- Center Fold Spine (Visible in Fold Mode) -->
                  <div class="print-card-fold-line" aria-hidden="true">
                    <span class="fold-pill" data-text="{msg.fold_label}"></span>
                  </div>

                  <!-- Back Half: Target Word Only, Centered in Bold Typography (Visible in Fold Mode) -->
                  <div class="print-card-back-half">
                    <div class="print-card-word" data-text="{front}"></div>
                  </div>
                </div>
              </div>
            </template>
          </div>

          <div class="sheet-foot">
            <span class="sheet-trim-guide" data-text="{msg.print_sheet_footer}"></span>
            <span class="sheet-page-num" data-text="{msg.sheet_page_label}"></span>
          </div>
        </div>

        <!-- Sheet 2: Two-Sided Mirrored Back Sheet (Declaratively rendered in duplex_h / duplex_v modes) -->
        <div class="sheet-paper sheet-paper-duplex-back">
          <div class="sheet-masthead duplex-masthead">
            <span class="sheet-archival-seal" data-text="{msg.duplex_back_sheet_title}"></span>
            <span class="sheet-archival-serial" data-text="{msg.duplex_back_sheet_sub}"></span>
          </div>

          <div class="sheet-grid duplex-back-grid" data-live="localized_card" data-filter="set_id=eq.{set_id}" data-order="id.asc">
            <template data-item>
              <div class="print-card-cell duplex-back-cell">
                <div class="print-card duplex-back-card" data-id="{id}" data-front="{front}">
                  <div class="cell-crop-tl" aria-hidden="true"></div>
                  <div class="cell-crop-tr" aria-hidden="true"></div>
                  <div class="cell-crop-bl" aria-hidden="true"></div>
                  <div class="cell-crop-br" aria-hidden="true"></div>
                  <div class="print-card-back-half">
                    <div class="print-card-word" data-text="{front}"></div>
                  </div>
                </div>
              </div>
            </template>
          </div>

          <div class="sheet-foot">
            <span class="sheet-trim-guide" data-text="{msg.print_sheet_footer}"></span>
            <span class="sheet-page-num" data-text="{msg.sheet_page_label}"></span>
          </div>
        </div>
      </div>
    </div>
  </div>
  </div>
  </div>
</section>
