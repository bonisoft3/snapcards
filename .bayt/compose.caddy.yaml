    environment:
      PORT: "8080"
      ORIGIN: ${ORIGIN:-https://localhost:${CADDY_TLS_HOST_PORT:-24469}}
      PRONTO_UPSTREAM_RENDER: render:8090
      ELECTRIC_SECRET: ${ELECTRIC_SECRET:-dev-electric-secret}
      PRONTO_UPSTREAM_CRUD: crud:3000
      PRONTO_UPSTREAM_ELECTRIC: electric:3000
      PRONTO_UPSTREAM_AUTH: auth:9999
      PRONTO_UPSTREAM_TICKER: ticker:9998
      PRONTO_UPSTREAM_RCLONE_S3: rclone-s3:3900
      PRONTO_UPSTREAM_IMGPROXY: imgproxy:8081
    healthcheck:
      test:
      - CMD
      - /usr/local/lib/bayt/http200/busybox
      - sh
      - -ec
      - >-
        export CURL_CA_BUNDLE="$${SSL_CERT_FILE:-/usr/local/lib/bayt/http200/ca.pem}";
        status=$$("$$@"); [ "$$status" = 200 ] || { printf 'HTTP status %s, expected
        200\n' "$$status" >&2; exit 1; }
      - http200
      - /usr/local/lib/bayt/http200/curl
      - --disable
      - --silent
      - --show-error
      - --head
      - --request
      - GET
      - --location
      - --max-redirs
      - "9"
      - --max-time
      - "5"
      - --proto
      - =http,https
      - --proto-redir
      - =http,https
      - --output
      - /dev/null
      - --write-out
      - "%{http_code}"
      - http://127.0.0.1:8080/health
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
      start_interval: 500ms
    image: bayt-snapcards-caddy:${BAYT_IMAGE_TAG:-${COMPOSE_PROJECT_NAME}}
    networks:
      default:
        aliases:
        - caddy
