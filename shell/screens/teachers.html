<section class="screen" data-screen="teachers">
  <button type="button" class="btn-more" popovertarget="more-sheet-teachers" aria-label="{msg.nav_more}"><span aria-hidden="true">⋯</span></button>
  <nav id="more-sheet-teachers" class="more-sheet" popover aria-label="{msg.nav_more}">
    <a data-route="cards" data-param-shelf="mine" class="more-link"><span class="more-icon" aria-hidden="true">🗂️</span><span data-text="{msg.nav_my_cards}"></span></a>
    <a data-route="cards" data-param-shelf="gallery" class="more-link"><span class="more-icon" aria-hidden="true">🌐</span><span data-text="{msg.nav_gallery}"></span></a>
    <a data-route="about" class="more-link"><span class="more-icon" aria-hidden="true">📖</span><span data-text="{msg.nav_about}"></span></a>
  </nav>
  <div class="device-scope" data-live="device" data-filter="id=eq.device" data-empty-row='{"id":"device","key":"","theme":"auto"}' data-theme="{theme}" data-cortex="teachersRows" data-machine-ref="theme">
  <article class="landing landing-teachers">
    <div class="landing-top">
      <p class="landing-crumb"><span class="landing-crumb-brand" data-text="{msg.app_title}"></span> <span class="landing-crumb-sep" aria-hidden="true">/</span> <span class="landing-crumb-section" data-text="{msg.teachers_section}"></span></p>
      <div class="header-utility-actions">
        <div class="lang-switch">
          <a data-route="teachers" data-locale="pt" data-locale-current="page" class="lang-link" data-text="{msg.lang_pt}"></a>
          <a data-route="teachers" data-locale="es" data-locale-current="page" class="lang-link" data-text="{msg.lang_es}"></a>
          <a data-route="teachers" data-locale="en" data-locale-current="page" class="lang-link" data-text="{msg.lang_en}"></a>
          <a data-route="teachers" data-locale="he" data-locale-current="page" class="lang-link" data-text="{msg.lang_he}"></a>
          <a data-route="teachers" data-locale="zh" data-locale-current="page" class="lang-link" data-text="{msg.lang_zh}"></a>
          <a data-route="teachers" data-locale="hi" data-locale-current="page" class="lang-link" data-text="{msg.lang_hi}"></a>
        </div>
        <div class="theme-switch" role="group">
          <button type="button" id="theme-auto" class="theme-btn" data-theme-val="auto" data-text="{msg.theme_auto}">Auto</button>
          <button type="button" id="theme-light" class="theme-btn" data-theme-val="light">☀️</button>
          <button type="button" id="theme-dark" class="theme-btn" data-theme-val="dark">🌙</button>
        </div>
      </div>
    </div>
    <header class="landing-hero">
      <div class="landing-hero-copy">
        <h1 class="landing-title"><span data-text="{msg.teachers_title}"></span> <span class="landing-title-accent" data-text="{msg.teachers_title_accent}"></span></h1>
        <p class="landing-lede" data-text="{msg.teachers_lede}"></p>
        <div class="landing-actions">
          <a class="landing-btn" data-route="generate" data-text="{msg.teachers_cta}"></a>
          <a class="landing-link" data-route="cards" data-text="{msg.about_cta_explore}"></a>
        </div>
      </div>
      <figure class="landing-art" aria-hidden="true">
        <span class="landing-art-label" data-text="{msg.teachers_art_label}"></span>
        <div class="landing-deck">
          <figure class="landing-card"><img src="/img/insecure/plain/s3://mecha-objects/seed/4372255aa87d9f3ae5f75c7d9e9c2507215199fb880dcc9a102d78e04d86a345.webp" alt="" width="152" height="102"></figure>
          <figure class="landing-card"><img src="/img/insecure/plain/s3://mecha-objects/seed/2d2a2b793083486ac06c90fc04faba941d0fc57e40fa704934b4227a47c10e3a.webp" alt="" width="152" height="102"></figure>
          <figure class="landing-card"><img src="/img/insecure/plain/s3://mecha-objects/seed/59d5bde6dfe321183b43f67cb160215e7f19e9c75cc50efe60c6a64757433cc0.webp" alt="" width="152" height="102"></figure>
          <figure class="landing-card"><img src="/img/insecure/plain/s3://mecha-objects/seed/42b9799a11458866adfa23f07eb4f84fd76014d808e8dbdf9432714555530935.webp" alt="" width="152" height="102"></figure>
        </div>
        <span class="landing-art-footer" data-text="{msg.teachers_art_footer}"></span>
      </figure>
    </header>

    <section class="landing-benefits" aria-labelledby="teachers-benefits-label">
      <p class="landing-label" id="teachers-benefits-label" data-text="{msg.teachers_benefits_label}"></p>
      <ul>
        <li><span class="landing-icon" aria-hidden="true">📚</span><h2 data-text="{msg.teachers_b1_title}"></h2><p data-text="{msg.teachers_b1}"></p></li>
        <li><span class="landing-icon" aria-hidden="true">🖨️</span><h2 data-text="{msg.teachers_b2_title}"></h2><p data-text="{msg.teachers_b2}"></p></li>
        <li><span class="landing-icon" aria-hidden="true">🔗</span><h2 data-text="{msg.teachers_b3_title}"></h2><p data-text="{msg.teachers_b3}"></p></li>
      </ul>
    </section>

    <footer class="landing-footer">
      <span data-text="{msg.about_signoff}"></span>
      <a href="https://www.bonisoft3.com/privacy.html" rel="privacy-policy" data-text="{msg.about_privacy}"></a>
    </footer>
  </article>
  </div>
</section>
