<section class="screen" data-screen="kids">
  <button type="button" class="btn-more" popovertarget="more-sheet-kids" aria-label="{msg.nav_more}"><span aria-hidden="true">⋯</span></button>
  <nav id="more-sheet-kids" class="more-sheet" popover aria-label="{msg.nav_more}">
    <a data-route="cards" data-param-shelf="mine" class="more-link"><span class="more-icon" aria-hidden="true">🗂️</span><span data-text="{msg.nav_my_cards}"></span></a>
    <a data-route="cards" data-param-shelf="gallery" class="more-link"><span class="more-icon" aria-hidden="true">🌐</span><span data-text="{msg.nav_gallery}"></span></a>
    <a data-route="about" class="more-link"><span class="more-icon" aria-hidden="true">📖</span><span data-text="{msg.nav_about}"></span></a>
  </nav>
  <div class="device-scope" data-live="device" data-filter="id=eq.device" data-empty-row='{"id":"device","key":"","theme":"auto"}' data-theme="{theme}" data-cortex="kidsRows" data-machine-ref="theme">
  <article class="landing landing-kids">
    <div class="landing-top">
      <p class="landing-crumb"><span class="landing-crumb-brand" data-text="{msg.app_title}"></span> <span class="landing-crumb-sep" aria-hidden="true">/</span> <span class="landing-crumb-section" data-text="{msg.kids_section}"></span></p>
      <div class="header-utility-actions">
        <div class="lang-switch">
          <a data-route="kids" data-locale="pt" data-locale-current="page" class="lang-link" data-text="{msg.lang_pt}"></a>
          <a data-route="kids" data-locale="es" data-locale-current="page" class="lang-link" data-text="{msg.lang_es}"></a>
          <a data-route="kids" data-locale="en" data-locale-current="page" class="lang-link" data-text="{msg.lang_en}"></a>
          <a data-route="kids" data-locale="he" data-locale-current="page" class="lang-link" data-text="{msg.lang_he}"></a>
          <a data-route="kids" data-locale="zh" data-locale-current="page" class="lang-link" data-text="{msg.lang_zh}"></a>
          <a data-route="kids" data-locale="hi" data-locale-current="page" class="lang-link" data-text="{msg.lang_hi}"></a>
        </div>
        <div class="theme-switch" role="group">
          <button type="button" id="theme-auto" class="theme-btn" data-theme-val="auto" data-text="{msg.theme_auto}">Auto</button>
          <button type="button" id="theme-light" class="theme-btn" data-theme-val="light">☀️</button>
          <button type="button" id="theme-dark" class="theme-btn" data-theme-val="dark">🌙</button>
        </div>
      </div>
    </div>
    <header class="landing-hero">
      <div class="landing-hero-copy">
        <h1 class="landing-title"><span data-text="{msg.kids_title}"></span> <span class="landing-title-accent" data-text="{msg.kids_title_accent}"></span></h1>
        <p class="landing-lede" data-text="{msg.kids_lede}"></p>
        <div class="landing-actions">
          <a class="landing-btn" data-route="generate" data-text="{msg.kids_cta}"></a>
          <a class="landing-link" data-route="cards" data-text="{msg.about_cta_explore}"></a>
        </div>
      </div>
      <figure class="landing-art" aria-hidden="true">
        <span class="landing-art-label" data-text="{msg.kids_art_label}"></span>
        <div class="landing-deck">
          <figure class="landing-card"><img src="/img/insecure/plain/s3://mecha-objects/seed/05c0872bf120ca4cb504a6c080f6b95d3070f8238358ffd33bfb83c278008d84.webp" alt="" width="152" height="102"><figcaption data-text="{msg.kids_word_1}"></figcaption></figure>
          <figure class="landing-card"><img src="/img/insecure/plain/s3://mecha-objects/seed/a85126f66e2f87751914f9dc925bdeea4fb636bee6690eb5c4350677350bd799.webp" alt="" width="152" height="102"><figcaption data-text="{msg.kids_word_2}"></figcaption></figure>
          <figure class="landing-card"><img src="/img/insecure/plain/s3://mecha-objects/seed/876a34cb402ab33c897098bf56c1b5605348a6a97922886e10a505fd72b389a7.webp" alt="" width="152" height="102"><figcaption data-text="{msg.kids_word_3}"></figcaption></figure>
        </div>
        <span class="landing-art-footer" data-text="{msg.kids_art_footer}"></span>
      </figure>
    </header>

    <section class="landing-benefits" aria-labelledby="kids-benefits-label">
      <p class="landing-label" id="kids-benefits-label" data-text="{msg.kids_benefits_label}"></p>
      <ul>
        <li><span class="landing-icon" aria-hidden="true">✨</span><h2 data-text="{msg.kids_b1_title}"></h2><p data-text="{msg.kids_b1}"></p></li>
        <li><span class="landing-icon" aria-hidden="true">🃏</span><h2 data-text="{msg.kids_b2_title}"></h2><p data-text="{msg.kids_b2}"></p></li>
        <li><span class="landing-icon" aria-hidden="true">🌍</span><h2 data-text="{msg.kids_b3_title}"></h2><p data-text="{msg.kids_b3}"></p></li>
      </ul>
    </section>

    <footer class="landing-footer">
      <span data-text="{msg.about_signoff}"></span>
      <a href="https://www.bonisoft3.com/privacy.html" rel="privacy-policy" data-text="{msg.about_privacy}"></a>
    </footer>
  </article>
  </div>
</section>
