        name: id
        pk: true
        type: string
        required: true
      - bounds:
          sizeMin: 1
        name: card_id
        type: string
        required: true
      - bounds:
          sizeMin: 1
        name: set_id
        type: string
        required: true
      - bounds:
          sizeMin: 1
        name: run
        type: string
        required: true
      - enum:
          - '2'
          - '3'
        name: level
        type: int32
        required: true
      - bounds:
          intMin: 1
        name: position
        type: int32
        required: true
      - defaulted: true
        default: waiting
        enum:
