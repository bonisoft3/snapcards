            light:
              'on':
                click@theme-auto: auto
                click@theme-dark: dark
            dark:
              'on':
                click@theme-auto: auto
                click@theme-light: light
    printedRows:
      via: rows
      lifetime: attachment
      screen: printed
      charts:
        theme:
          field: theme
          initial: auto
          states:
            auto:
              'on':
                click@theme-light: light
