pipelines:
  - fold: pipelines/favorite-recount.js
    key: deck_id
    name: favorite-recount
    from: favorite
    projects: favorite_count
    to: deck_stats
    aggregate: 'select=deck_id,txid,deleted_at'
    watermark: counted_txid
    dedupe:
      - user_id
      - deck_id
    retracted: deleted_at
    pair:
      table: favorite_count
      counted: mine_counted
      total: total_at_read
      asOf: as_of_txid
  - key: deck_id
    name: deck-cover
    from: flashcard
    shim: pipelines/deck-cover.browser.js
    to: deck_stats
    aggregate: 'select=set_id,id,back'
  - key: id
    name: favorite-count
    from: favorite
    shim: pipelines/favorite-count.browser.js
    to: favorite_count
    aggregate: 'select=user_id,deck_id,txid,deleted_at'
uniques:
  favorite:
    - - user_id
      - deck_id
  favorite_count:
    - - user_id
      - deck_id
  place_answer:
    - - kind
      - q
      - lang
  browser_draft:
    - - topic
      - locale
      - status
      - set_id
      - run
units:
  delivery-map:
    grants:
      - geolocation
    isolation: realm
    ports:
      reads:
        - delivery_draft
      raises:
        pin:
          type: object
          fields:
            latitude:
              type: string
              maxLength: 32
            longitude:
              type: string
              maxLength: 32
            source:
              type: string
              maxLength: 3
              values:
                - ''
                - gps
                - map
    files:
      - shell/units/delivery-map/index.html
      - shell/units/delivery-map/vendor/maplibre-gl.js
      - shell/units/delivery-map/vendor/maplibre-gl.css
    src: shell/units/delivery-map/index.html
  geocoder:
    isolation: agent
    memo:
      table: place_answer
      key:
        - kind
        - q
        - lang
      columns:
        - kind
        - q
        - lang
        - p0
        - p1
        - p2
        - p3
        - p4
    ports:
      reads:
        - delivery_draft
      raises:
        found:
          type: object
          fields:
            kind:
              type: string
              maxLength: 65536
            q:
              type: string
              maxLength: 2000
            lang:
              type: string
              maxLength: 8
            p0:
              type: string
              maxLength: 2000
            p1:
              type: string
              maxLength: 2000
            p2:
              type: string
              maxLength: 2000
            p3:
              type: string
              maxLength: 2000
            p4:
              type: string
              maxLength: 2000
    files:
      - shell/units/geocoder/unit.js
    src: shell/units/geocoder/unit.js
  ai-browser:
    isolation: agent
    memo:
      table: browser_draft
      key:
        - topic
        - locale
        - status
        - set_id
        - run
      columns:
        - topic
        - locale
        - status
        - w0
        - w1
        - w2
        - w3
        - w4
        - set_id
        - run
    ports:
      reads:
        - generation_form
      raises:
        draft:
          type: object
          fields:
            topic:
              type: string
              maxLength: 128
            locale:
              type: string
              maxLength: 32
            status:
              type: string
              maxLength: 32
            w0:
              type: string
              maxLength: 128
            w1:
              type: string
              maxLength: 128
            w2:
              type: string
              maxLength: 128
            w3:
              type: string
              maxLength: 128
            w4:
              type: string
              maxLength: 128
            set_id:
              type: string
              maxLength: 128
            run:
              type: string
              maxLength: 128
    files:
      - shell/units/ai-browser/unit.js
    src: shell/units/ai-browser/unit.js
  print-payment:
    grants:
      - payment
    isolation: realm
    ports:
      reads:
        - delivery_draft
      raises:
        checkout:
          type: object
          fields:
            outcome:
              type: string
              maxLength: 16
              values:
                - completed
                - cancelled
    files:
      - shell/units/print-payment/index.html
    src: shell/units/print-payment/index.html
    subdomain: payments
