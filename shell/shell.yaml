                  assign:
                    next: 0
                    words: complete
                'signal:deck_progress.drawn2_complete':
                  target: generating
                  reenter: false
                  assign:
                    next: 3
                    words: complete
                'signal:deck_progress.drawn2_partial':
                  target: generating
                  reenter: false
                  assign:
                    next: 3
                    words: complete
                'signal:deck_progress.drawn2_failed':
                  target: generating
                  reenter: false
                  assign:
                    next: 3
