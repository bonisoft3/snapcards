                - src: legacyGenerationDeck
                  id: legacy-deck
                - src: generationProgress
                  id: progress
                - src: generationDeck
                  id: deck
        collectionSelection:
          field: status
          initial: playing
          'on': {}
          states:
            playing: {}
            fullscreen: {}
            completed: {}
        preview:
          field: status
          initial: idle
          'on':
            click@btn-create-more:
              target: idle
              assign:
                run: ''
          states:
            idle: {}
            generating: {}
            done: {}
            partial: {}
            failed: {}
    printRows:
      via: rows
      lifetime: attachment
      screen: print
      charts:
        theme:
          field: theme
          initial: auto
          states:
            auto:
              'on':
                click@theme-light: light
                click@theme-dark: dark
            light:
              'on':
                click@theme-auto: auto
                click@theme-dark: dark
            dark:
              'on':
                click@theme-auto: auto
                click@theme-light: light
        selection:
          field: status
          initial: playing
          'on':
            input@deck-search-input:
              assign:
                back:
                  type: event
                  params:
                    field: value
            change@deck-search-input:
              assign:
                back:
                  type: event
                  params:
                    field: value
            click@btn-window-print: {}
            click@btn-print-trigger: {}
          states:
            playing:
              'on': {}
              always:
                - guard:
                    type: row-is
                    params:
                      finished: 'yes'
                  target: completed
            completed:
              'on': {}
              always:
                - guard:
                    type: row-is
                    params:
                      finished: ''
                  target: playing
        settings:
          - field: vendor
            initial: print_at_home
            states:
              print_at_home:
                'on':
                  click@btn-print-vendor: print_shop
              print_shop:
                'on':
                  click@btn-print-vendor: prodigi
              prodigi:
                'on':
                  click@btn-print-vendor: print_at_home
          - field: stock
            initial: gloss
            states:
              gloss:
                'on':
                  click@btn-print-stock: mohawk
              mohawk:
                'on':
                  click@btn-print-stock: gloss
          - field: paper
            initial: a4
            states:
              a4:
                'on':
                  click@btn-print-paper: letter
              letter:
                'on':
                  click@btn-print-paper: a4
          - field: orientation
            initial: portrait
            states:
              portrait:
                'on':
                  click@btn-print-orientation: landscape
              landscape:
                'on':
                  click@btn-print-orientation: portrait
          - field: card_size
            initial: standard
            states:
              standard:
                'on':
                  click@btn-print-size: jumbo
              jumbo:
                'on':
                  click@btn-print-size: poster
              poster:
                'on':
                  click@btn-print-size: mini
              mini:
                'on':
                  click@btn-print-size: standard
          - field: layout
            initial: fold
            states:
              fold:
                'on':
                  click@btn-print-grid: duplex_h
              duplex_h:
                'on':
                  click@btn-print-grid: duplex_v
              duplex_v:
                'on':
                  click@btn-print-grid: 2x2
              2x2:
                'on':
                  click@btn-print-grid: 3x3
              3x3:
                'on':
                  click@btn-print-grid: fold
          - field: cut_lines
            initial: 'yes'
            states:
              'yes':
                'on':
                  click@btn-print-lines: 'no'
              'no':
                'on':
                  click@btn-print-lines: 'yes'
    kidsRows:
      via: rows
      lifetime: attachment
      screen: kids
      charts:
        theme:
          field: theme
          initial: auto
          states:
            auto:
              'on':
                click@theme-light: light
                click@theme-dark: dark
            light:
              'on':
                click@theme-auto: auto
                click@theme-dark: dark
            dark:
              'on':
                click@theme-auto: auto
                click@theme-light: light
    teachersRows:
