                    values:
                      set_id: ''
                      run: ''
                      input:
                        type: generation-input
                      created_at: '{now}'
                edited:
                  target: idle
                  assign:
                    run: ''
                'signal:deck.removed':
                  target: idle
                  reenter: false
                  assign:
                    set_id: ''
                    run: ''
                'signal:deck_progress.drafting':
                  target: generating
                  reenter: false
                  assign:
                    next: 2
                'signal:deck_progress.drawing2':
                  target: generating
                  reenter: false
                  assign:
