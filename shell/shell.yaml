          - pending
          - drawn
          - failed
          - unknown
        name: status
        type: string
        required: true
      - bounds:
          sizeMin: 0
        name: detail
        type: string
        required: true
      - bounds:
          sizeMin: 0
        default: ''
        defaulted: true
        name: description
        type: string
        required: true
      - bounds:
          intMin: 0
        default: 0
        defaulted: true
        name: redraws
