<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment</title>
<style>
:root { color-scheme: light; --ink: #24211e; --muted: #5d5142; --line: #cfc3b1; --field: #fffdf9; --accent: #28231e; --accent-hover: #4a3728; --link: #7e451e; --error: #793c33; --error-bg: #f6e9e5; --error-line: #a84739; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; overflow: hidden; font: 15px/1.45 system-ui, -apple-system, sans-serif; color: var(--ink); background: transparent; }
#root { display: grid; }
#root:empty { display: none; }
form { display: grid; gap: 10px; padding: 2px 0 4px; }
label { display: grid; gap: 4px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
input { font: 600 15px/1.35 system-ui, sans-serif; height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 3px; background: var(--field); color: var(--ink); }
input:focus-visible { outline: 2px solid #7e451e; outline-offset: 1px; border-color: #7e451e; }
button { font: 600 14px/1.25 system-ui, sans-serif; min-height: 40px; padding: 9px 14px; border-radius: 3px; border: 1px solid var(--line); background: var(--field); color: var(--ink); cursor: pointer; transition: background-color .14s ease, border-color .14s ease; }
button:hover { background: #f1eadf; border-color: #8b7965; }
button.pay { min-height: 46px; background: var(--accent); border-color: var(--accent); color: #fffaf2; font-size: 15px; font-weight: 700; }
button.pay:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
button.quiet { min-height: 34px; padding: 6px 10px; border: 0; background: transparent; color: var(--link); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
button.quiet:hover { background: transparent; color: var(--ink); }
.note { margin: 0; padding: 10px 12px; border-radius: 3px; border: 1px solid #ded6ca; border-inline-start: 2px solid #c39855; background: #f1eadf; color: var(--muted); font-size: 13px; }
.error { color: var(--error); background: var(--error-bg); border-color: #e6cfc8; border-inline-start: 2px solid var(--error-line); }
iframe { display: block; width: 100%; height: 280px; border: 0; border-radius: 3px; overflow: hidden; background: transparent; }
</style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";
const root = document.getElementById("root");
const post = (message) => parent.postMessage(message, "*");
const raise = (name, detail) => post({ type: "pronto:event", name, detail });
const appearance = {
  theme: "flat",
  variables: {
    colorPrimary: "#28231e",
    colorBackground: "#fffdf9",
    colorText: "#24211e",
    colorTextSecondary: "#5d5142",
    colorDanger: "#793c33",
    fontFamily: "system-ui, -apple-system, sans-serif",
    fontSizeBase: "15px",
    spacingUnit: "4px",
    borderRadius: "3px",
  },
  rules: {
    ".Input": {
      border: "1px solid #cfc3b1",
      backgroundColor: "#fffdf9",
      color: "#24211e",
      boxShadow: "none",
    },
    ".Input:focus": {
      border: "1px solid #7e451e",
      outline: "2px solid #7e451e",
      outlineOffset: "1px",
      boxShadow: "none",
    },
    ".Label": {
      color: "#5d5142",
      fontWeight: "600",
      fontSize: "12.5px",
    },
  },
};

let currentUrl = "";
let lastHeight = -1;
let childFrame = null;
let renderToken = 0;
let scriptPromise = null;
let loadedSrc = "";

function reportHeight(override) {
  const height = override ?? Math.ceil(root.getBoundingClientRect().height);
  if (height === lastHeight) return;
  lastHeight = height;
  post({ type: "pronto:event", name: "height", height });
}

function loadStripe(src, pk, locale) {
  if (!scriptPromise || loadedSrc !== src) {
    loadedSrc = src;
    scriptPromise = new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src = src;
      script.onload = () => resolve();
      script.onerror = () => reject(new Error(`Failed to load Stripe.js from ${src}`));
      document.head.appendChild(script);
    });
  }
  return scriptPromise.then(() => {
    if (typeof globalThis.Stripe !== "function") {
      throw new Error("Stripe.js did not expose globalThis.Stripe");
    }
    // The locale is the instance's: initCheckout's elementsOptions take the
    // appearance alone.
    return globalThis.Stripe(pk, { locale });
  });
}

async function render(props) {
  const url = String(props?.url ?? "");
  if (url === currentUrl) return;
  currentUrl = url;
  const token = ++renderToken;
  root.replaceChildren();
  childFrame = null;
  if (!url) {
    reportHeight(0);
    return;
  }
  const lang = String(props?.lang || "en");
  const dir = String(props?.dir || "ltr");
  document.documentElement.lang = lang;
  document.documentElement.dir = dir;
  const parsed = new URL(url);
  const scriptSrc = `${parsed.origin}${parsed.pathname}`;
  const pk = String(props?.publishableKey || parsed.searchParams.get("pk") || "");
  const clientSecret = new URLSearchParams(parsed.hash.slice(1)).get("client_secret");
  if (!pk || !clientSecret) {
    throw new Error("Stripe checkout requires publishableKey and client_secret");
  }
  const stripe = await loadStripe(scriptSrc, pk, lang || "auto");
  if (token !== renderToken) return;
  // The session is opened as ui_mode elements, whose client is initCheckout.
  if (typeof stripe.initCheckout !== "function") {
    throw new Error("Stripe instance does not expose initCheckout");
  }
  const checkout = await stripe.initCheckout({
    clientSecret,
    elementsOptions: { appearance },
  });
  if (token !== renderToken) return;
  if (typeof checkout.loadActions === "function" || typeof checkout.confirm === "function") {
    let actions = checkout;
    if (typeof checkout.loadActions === "function") {
      const loaded = await checkout.loadActions();
      if (token !== renderToken) return;
      if (!loaded || loaded.type !== "success") {
        throw new Error(loaded?.error?.message ?? "Stripe failed to load checkout actions");
      }
      actions = loaded.actions;
    }
    const sessionState = typeof actions.getSession === "function"
      ? actions.getSession()
      : typeof checkout.session === "function"
      ? checkout.session()
      : null;
    const initialEmail = String(props?.email || sessionState?.email || "");
    const form = document.createElement("form");
    const emailLabel = document.createElement("label");
    const emailLabelText = document.createElement("span");
    emailLabelText.textContent = String(props?.emailLabel || "Email");
    const emailInput = document.createElement("input");
    emailInput.name = "email";
    emailInput.type = "email";
    emailInput.required = true;
    emailInput.autocomplete = "email";
    emailInput.value = initialEmail;
    emailInput.readOnly = Boolean(sessionState?.email);
    emailLabel.append(emailLabelText, emailInput);
    const mountEl = document.createElement("div");
    const errorEl = document.createElement("p");
    errorEl.className = "note error";
    errorEl.setAttribute("role", "alert");
    errorEl.hidden = true;
    const payBtn = document.createElement("button");
    payBtn.type = "submit";
    payBtn.className = "pay";
    payBtn.textContent = String(props?.payLabel || "Pay");
    const cancelBtn = document.createElement("button");
    cancelBtn.type = "button";
    cancelBtn.className = "quiet";
    cancelBtn.textContent = String(props?.cancelLabel || "Cancel and return");
    cancelBtn.addEventListener("click", () => {
      if (token !== renderToken) return;
      raise("checkout", { outcome: "cancelled" });
    });
    form.append(emailLabel, mountEl, errorEl, payBtn, cancelBtn);
    root.replaceChildren(form);
    checkout.createPaymentElement().mount(mountEl);
    form.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      if (token !== renderToken) return;
      const email = emailInput.value.trim();
      if (!email) {
        errorEl.textContent = String(props?.emailNeeded || "An email address is required.");
        errorEl.hidden = false;
        reportHeight();
        return;
      }
      payBtn.disabled = true;
      errorEl.hidden = true;
      // A session opened with the order's email (print-session's customer_email) holds it:
      // Stripe refuses an email in confirm() then, and the field only shows it.
      const currentEmail = (typeof actions.getSession === "function" ? actions.getSession()?.email : null) ?? initialEmail;
      const sessionHoldsEmail = Boolean(currentEmail);
      if (!sessionHoldsEmail && typeof actions.updateEmail === "function" && email !== currentEmail) {
        const emailRes = await actions.updateEmail(email);
        if (token !== renderToken) return;
        if (emailRes?.type === "error" || emailRes?.error) {
          errorEl.textContent = emailRes.error?.message ?? String(props?.errorLabel || "Invalid email address.");
          errorEl.hidden = false;
          payBtn.disabled = false;
          reportHeight();
          return;
        }
      }
      const res = await actions.confirm(sessionHoldsEmail ? { redirect: "if_required" } : { email, redirect: "if_required" });
      if (token !== renderToken) return;
      if (res?.type === "error" || res?.error) {
        errorEl.textContent = res.error?.message ?? String(props?.errorLabel || "Payment could not be completed.");
        errorEl.hidden = false;
        payBtn.disabled = false;
        reportHeight();
        return;
      }
      raise("checkout", { outcome: "completed" });
    });
    reportHeight();
    return;
  }
  checkout.createPaymentElement().mount(root);
  childFrame = root.querySelector("#checkout-frame");
  reportHeight(280);
}

new ResizeObserver(() => reportHeight()).observe(root);

addEventListener("message", (e) => {
  if (e.source === parent) {
    const message = e.data;
    if (message === null || typeof message !== "object" || message.type !== "pronto:props") return;
    void render(message.props);
    return;
  }
  if (childFrame && e.source === childFrame.contentWindow) {
    const message = e.data;
    if (message === null || typeof message !== "object") return;
    if (message.type === "stripe-simulator:resize") {
      const h = Number(message.height);
      if (Number.isFinite(h) && h > 0) {
        childFrame.style.height = `${Math.ceil(h)}px`;
        reportHeight(Math.ceil(h));
      }
      return;
    }
    if (message.type !== "stripe-simulator:checkout") return;
    const outcome = String(message.outcome ?? "");
    if (outcome === "completed" || outcome === "cancelled") {
      raise("checkout", { outcome });
    }
  }
});

post({ type: "pronto:ready" });
</script>
</body>
</html>
